<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles con Amor - Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #E21C7F;
            --secondary: #FF69B4;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #E21C7F, #FF69B4, #b01563, #ff85c2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 40px;
            max-width: 350px;
            width: 85%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            animation: slideUp 0.8s ease-out;
            position: relative;
            /* Asegura que el contenido no se desborde si el logo es muy grande antes de cargar el CSS */
            margin-top: 50px; 
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor del Logo Real */
        .profile-container {
            width: 110px; /* Un poco más grande para que luzca el logo */
            height: 110px;
            background: white;
            border-radius: 50%;
            margin: -95px auto 20px auto; /* Eleva el logo sobre la tarjeta */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            overflow: hidden; /* Importante para que la imagen se corte en círculo */
            padding: 5px; /* Pequeño colchón interno */
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 'contain' asegura que se vea la caja de regalo completa sin cortarse */
            border-radius: 50%; /* Refuerza la forma circular */
        }

        h2 { margin: 0; color: var(--primary); font-weight: 600; font-size: 1.4rem; }
        .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 25px; display: block; letter-spacing: 1px;}

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px; /* Espaciado uniforme entre botones */
        }

        .links-container a {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-radius; /* Asegura que el padding no afecte el ancho */
        }

        .links-container a:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        /* Alineación perfecta de iconos */
        .links-container i { 
            margin-right: 15px; 
            font-size: 1.2rem; 
            width: 25px; /* Ancho fijo para el icono */
            text-align: center; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Colores */
        .btn-whatsapp { background-color: #25D366; }
        .btn-facebook { background-color: #1877F2; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .btn-vcf { background-color: #333; margin-top: 10px; font-weight: 600; cursor: pointer; justify-content: center;}


        .gallery-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--primary);
    margin: 10px 0 15px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.image-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Crea 2 columnas iguales */
    gap: 10px; /* Espacio entre fotos */
    margin-bottom: 20px;
}

.grid-item {
    aspect-ratio: 1 / 1; /* Hace que todas las fotos sean perfectamente cuadradas */
    overflow: hidden;
    border-radius: 15px;
    background: #eee; /* Color de carga mientras aparece la foto */
}

.grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Recorta la imagen para que llene el cuadro sin deformarse */
    transition: transform 0.4s ease;
}

/* Efecto visual al tocar o pasar el mouse */
.grid-item:hover img {
    transform: scale(1.1);
}

    </style>
</head>
<body>

<div class="card">
    <div class="profile-container">
        <img src="logo.png" alt="Detalles con Amor - Logo">
    </div>
    
    <h2>Detalles con Amor 🎁</h2>
    <span class="subtitle">Pequeños detalles, grandes emociones</span>

    <div class="links-container">
        <a href="https://wa.me/5214791385172" class="btn-whatsapp">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        
        <a href="https://www.facebook.com/profile.php?id=61572496917401" class="btn-facebook">
            <i class="fab fa-facebook-f"></i> Facebook
        </a>
        
        <a href="#" class="btn-insta">
            <i class="fab fa-instagram"></i> Instagram
        </a>
        <div class="gallery-title">Nuestros Detalles</div>
<div class="image-grid">
    <div class="grid-item"><img src="img/img1.jpeg" alt="Detalle 1"></div>
    <div class="grid-item"><img src="img/img2.jpeg" alt="Detalle 2"></div>
    <div class="grid-item"><img src="img/img3.jpeg" alt="Detalle 3"></div>
    <div class="grid-item"><img src="img/img4.jpeg" alt="Detalle 4"></div>
</div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">

        <a onclick="downloadVCF()" class="btn-vcf">
            <i class="fas fa-user-plus"></i> Guardar Contacto
        </a>
    </div>
</div>

<script>
    function downloadVCF() {
        // Configuramos la VCard con los datos reales
        const vcard = "BEGIN:VCARD\n" +
                      "VERSION:3.0\n" +
                      "FN:Detalles con Amor (Jessica)\n" +
                      "ORG:Detalles con Amor;\n" +
                      "TEL;TYPE=CELL:+5214791385172\n" +
                      "NOTE:Negocio de Regalos y Detalles\n" +
                      "URL:https://www.facebook.com/profile.php?id=61572496917401\n" +
                      "END:VCARD";
        
        const blob = new Blob([vcard], { type: "text/vcard" });
        const url = window.URL.createObjectURL(blob);
        const newLink = document.createElement("a");
        newLink.href = url;
        newLink.setAttribute("download", "Jessica_Detalles_con_Amor.vcf");
        newLink.click();
        // Limpieza de memoria
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
