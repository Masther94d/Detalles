<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Premium - Detalles con Amor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
    :root {
        --rosa-principal: #E21C7F; /* Fucsia */
        --rosa-pastel: #FFF0F5;    /* Fondo */
        --rosa-claro: #FFB6C1;     /* Detalles */
    }

    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: var(--rosa-pastel); 
        color: #333;
        scroll-behavior: smooth; 
        margin: 0;
        padding: 0;
    }

    /* Fondo con gradiente rosa animado */
    #particles-js {
        position: fixed;
        width: 100%; height: 100%;
        top: 0; left: 0; z-index: -1;
        background: linear-gradient(-45deg, #FFF0F5, #FFDEF0, #FFF5F7, #FFDEF0);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    /* Tarjeta Principal de Cristal Rosa */
    .card-glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 40px;
        box-shadow: 0 20px 50px rgba(226, 28, 127, 0.1);
    }

    /* Navegación Estilo Cápsula */
    .nav-premium {
        position: sticky; top: 20px; z-index: 100;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 50px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        max-width: fit-content; margin: 0 auto 50px auto;
    }
    .nav-btn {
        color: #555; font-size: 0.8rem; font-weight: 600;
        padding: 10px 22px; border-radius: 40px; transition: 0.4s;
        display: flex; align-items: center; gap: 8px;
        text-transform: uppercase; letter-spacing: 1px;
    }
    .nav-btn:hover { color: var(--rosa-principal); background: rgba(255, 255, 255, 0.1); }
    .nav-btn.active { background: var(--rosa-principal); color: white; box-shadow: 0 8px 20px rgba(226, 28, 127, 0.3); }

    /* Títulos de Sección Premium */
    .section-header-pink {
        position: relative; padding-bottom: 12px; margin-bottom: 35px;
        color: var(--rosa-principal); font-size: 1.6rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 3px; display: inline-block;
    }
    .section-header-pink::after {
        content: ''; position: absolute; bottom: 0; left: 0;
        width: 80px; height: 5px;
        background: linear-gradient(90deg, var(--rosa-principal), var(--rosa-claro));
        border-radius: 3px;
    }

    /* Efecto de Imagen Flotante */
    .product-wrapper {
        position: relative; overflow: hidden; border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        background: white; border: 4px solid white;
    }
    .product-wrapper:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(226, 28, 127, 0.15);
    }
    .product-img {
        width: 100%; height: 100%; object-fit: cover;
        cursor: zoom-in; transition: 0.6s;
    }
    .product-wrapper:hover .product-img { transform: scale(1.1); filter: brightness(1.05); }

    /* Lightbox (Imagen Grande) */
    .lightbox {
        display: none; position: fixed; z-index: 9999; top: 0; left: 0;
        width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(15px); align-items: center; justify-content: center;
        cursor: zoom-out; animation: fadeIn 0.3s ease;
    }
    .lightbox img {
        max-width: 90%; max-height: 85%; border-radius: 20px;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
        transform: scale(0.9); transition: transform 0.3s ease;
    }
    .lightbox.active img { transform: scale(1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Botón Flotante Rosa */
    .fab-home-pink {
        position: fixed; bottom: 30px; left: 20px;
        width: 60px; height: 60px;
        background: #ffffff00; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        color: var(--rosa-principal); font-size: 1.6rem; z-index: 9999;
        box-shadow: 0 10px 30px rgba(226, 28, 127, 0.2);
        border: 2px solid rgba(226, 28, 127, 0.1);
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .fab-home-pink:hover { transform: scale(1.1) rotate(-10deg); background: var(--rosa-principal); color: white; }
</style>
</head>
<body>

    <div id="particles-js"></div>

    <a href="index.html" class="fab-home-pink" title="Volver al contacto"><i class="fas fa-home"></i></a>

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="text-center mt-10 mb-16" data-aos="fade-down">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-[#E21C7F] to-[#FFB6C1]">
                Catálogo ✨
            </h1>
          
        </header>

        <nav class="nav-premium flex flex-wrap justify-center gap-1" data-aos="fade-up">
            <a href="#flores" class="nav-btn active"><i class="fas fa-seedling"></i> Flores</a>
            <a href="#cajas" class="nav-btn"><i class="fas fa-box-open"></i> Cajas</a>
            <a href="#globos" class="nav-btn"><i class="fas fa-cloud"></i> Globos</a>
        </nav>

        <main class="card-glass p-8 md:p-12 mb-20">
            <section id="flores" class="mb-24">
                <h2 class="section-header-pink">Arreglos Florales</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                    <div class="grid gap-6">
                        <div class="product-wrapper aspect-[3/4]" data-aos="zoom-in">
                            <img src="img/img1.jpeg" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                        <div class="product-wrapper aspect-[1/1]" data-aos="zoom-in" data-aos-delay="100">
                            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                    </div>
                    <div class="grid gap-6">
                        <div class="product-wrapper aspect-[1/1]" data-aos="zoom-in" data-aos-delay="200">
                            <img src="img/img4.jpeg" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                        <div class="product-wrapper aspect-[3/4]" data-aos="zoom-in" data-aos-delay="300">
                            <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                    </div>
                    <div class="grid gap-6">
                        <div class="product-wrapper aspect-[3/4]" data-aos="zoom-in" data-aos-delay="400">
                            <img src="https://images.unsplash.com/photo-1591886960571-74d43a9d4166" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                    </div>
                </div>
            </section>

          <section id="cajas" class="mb-24">
                <h2 class="section-header-pink">Cajas</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                    <div class="grid gap-6">
                        <div class="product-wrapper aspect-[3/4]" data-aos="zoom-in">
                            <img src="img/img1.jpeg" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                        <div class="product-wrapper aspect-[1/1]" data-aos="zoom-in" data-aos-delay="100">
                            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                    </div>
                    <div class="grid gap-6">
                        <div class="product-wrapper aspect-[1/1]" data-aos="zoom-in" data-aos-delay="200">
                            <img src="img/img4.jpeg" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                        <div class="product-wrapper aspect-[3/4]" data-aos="zoom-in" data-aos-delay="300">
                            <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                    </div>
                    <div class="grid gap-6">
                        <div class="product-wrapper aspect-[3/4]" data-aos="zoom-in" data-aos-delay="400">
                            <img src="https://images.unsplash.com/photo-1591886960571-74d43a9d4166" class="product-img" onclick="openLightbox(this.src)">
                        </div>
                    </div>
                </div>
            </section>

            <section id="globos">
                <h2 class="section-header-pink">Globos y Decoración</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                    <div class="product-wrapper aspect-[3/4]" data-aos="flip-left">
                        <img src="img/img3.jpeg" class="product-img" onclick="openLightbox(this.src)">
                    </div>
                    <div class="product-wrapper aspect-[1/1]" data-aos="flip-left" data-aos-delay="100">
                        <img src="https://images.unsplash.com/photo-1530103862676-fa8c91abe99b" class="product-img" onclick="openLightbox(this.src)">
                    </div>
                    <div class="product-wrapper aspect-[3/4]" data-aos="flip-left" data-aos-delay="200">
                        <img src="https://images.unsplash.com/photo-1574391884720-bbc37bb0513c" class="product-img" onclick="openLightbox(this.src)">
                    </div>
                    <div class="product-wrapper aspect-[1/1]" data-aos="flip-left" data-aos-delay="300">
                        <img src="img/logo.png" class="product-img" onclick="openLightbox(this.src)">
                    </div>
                </div>
            </section>
        </main>

        <footer class="text-center py-12 text-gray-500 text-sm border-t border-white/30">
            <p>Hecho con amor para momentos especiales.</p>
            <p class="font-semibold text-[#E21C7F]">Detalles con Amor ✨</p>
        </footer>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Imagen Grande">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inicializar animaciones al scroll
        AOS.init({ duration: 1000, once: true });

        // Lógica del Lightbox
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lb.style.display = 'flex';
            setTimeout(() => lb.classList.add('active'), 10);
        }
        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('active');
            setTimeout(() => lb.style.display = 'none', 300);
        }

        // Fondo animado de Partículas (integrado)
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 18, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#E21C7F" }, // Color rosa fucsia
                "shape": { "type": "heart" }, // Forma de corazón
                "opacity": { "value": 0.2, "random": true },
                "size": { "value": 6, "random": true },
                "move": { "enable": true, "speed": 1.5, "direction": "bottom", "out_mode": "out" }
            }
        });

        // Script para activar el botón nav al hacer scroll (opcional pero pro)
        window.addEventListener('scroll', function() {
            const sections = document.querySelectorAll('section');
            const navLinks = document.querySelectorAll('.nav-btn');
            
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 100) {
                    current = section.getAttribute('id');
                }
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
