<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Detalles con Amor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">

<style>
    body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
    .card-wide { max-width: 900px !important; width: 95% !important; margin: 40px auto; }
    
    /* Títulos de sección más elegantes */
    .section-title { 
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        padding: 12px 25px;
        border-radius: 20px;
        display: inline-block;
        margin: 40px 0 25px 0;
        color: white;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* Navegación Premium */
    .nav-sticky {
        position: sticky;
        top: 15px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 50px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        max-width: fit-content;
        margin: 0 auto 40px auto;
    }

    .nav-btn {
        color: white;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 8px 20px;
        border-radius: 50px;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Efecto de iluminación al pasar el mouse */
    .nav-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(226, 28, 127, 0.3);
    }

    /* Clase para cuando la sección está activa (opcional con JS) */
    .nav-btn:active {
        transform: scale(0.95);
    }

    /* Iconos dentro del nav */
    .nav-btn i {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.8);
    }
</style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="card card-wide">
        <a href="index.html" class="back-link-premium mb-6">
            <i class="fas fa-arrow-left"></i> Volver
        </a>

        <h2 class="text-white text-3xl font-bold text-center mb-2">Nuestro Catálogo 💐</h2>
        <p class="text-white/70 text-center text-sm mb-8">Explora nuestras categorías</p>

   <nav class="nav-sticky flex justify-center items-center gap-1">
    <a href="#flores" class="nav-btn">
        <i class="fas fa-seedling"></i> Flores
    </a>
    <a href="#cajas" class="nav-btn">
        <i class="fas fa-box-open"></i> Cajas
    </a>
    <a href="#globos" class="nav-btn">
        <i class="fas fa-cloud"></i> Globos
    </a>
</nav>
        <div id="flores">
            <div class="section-title">Arreglos Florales</div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="img/img1.jpeg" alt="">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9" alt="">
                </div>
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="img/img4.jpeg" alt="">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1561181286-d3fee7d55364" alt="">
                </div>
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1591886960571-74d43a9d4166" alt="">
                </div>
            </div>
        </div>

        <div id="cajas">
            <div class="section-title">Cajas Personalizadas</div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="img/img2.jpeg" alt="">
                </div>
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48" alt="">
                </div>
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1513201099705-a9746e1e201f" alt="">
                </div>
            </div>
        </div>

        <div id="globos">
            <div class="section-title">Globos y Decoración</div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="img/img3.jpeg" alt="">
                </div>
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1530103862676-fa8c91abe99b" alt="">
                </div>
                <div class="grid gap-4">
                    <img class="h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1574391884720-bbc37bb0513c" alt="">
                </div>
            </div>
        </div>

        <hr class="border-white/20 my-12">
        <p class="text-white/50 text-center text-xs pb-6">© 2026 Detalles con Amor | Huanímaro, Gto.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 15, "density": { "enable": true, "value_area": 800 } },
                "shape": { "type": "image", "image": { "src": "https://cdn-icons-png.flaticon.com/512/833/833472.png", "width": 100, "height": 100 } },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 10, "random": true },
                "move": { "enable": true, "speed": 1.5, "direction": "bottom", "out_mode": "out" }
            }
        });
    </script>
</body>
</html>
