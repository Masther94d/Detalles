<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Detalles con Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
    <style>
        .back-link-premium {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .back-link-premium:hover { background: rgba(255, 255, 255, 0.3); transform: translateX(-5px); }
        .filter-container { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
        .filter-btn {
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }
        .filter-btn.active { background: white; color: var(--primary); font-weight: 600; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gallery-item { aspect-ratio: 1/1; border-radius: 15px; overflow: hidden; background: rgba(255,255,255,0.2); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="card">
        <a href="index.html" class="back-link-premium">
            <i class="fas fa-arrow-left"></i> Volver a Contacto
        </a>
        <h2>Catálogo 💐</h2>
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCat('all')">Todos</button>
            <button class="filter-btn" onclick="filterCat('flores')">Flores</button>
            <button class="filter-btn" onclick="filterCat('cajas')">Cajas</button>
            <button class="filter-btn" onclick="filterCat('globos')">Globos</button>
        </div>
        <div class="gallery-grid" id="gallery">
            <div class="gallery-item flores"><img src="img/img1.jpeg"></div>
            <div class="gallery-item cajas"><img src="img/img2.jpeg"></div>
            <div class="gallery-item globos"><img src="img/img3.jpeg"></div>
            <div class="gallery-item flores"><img src="img/img4.jpeg"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 15, "density": { "enable": true, "value_area": 800 } },
                "shape": { "type": "image", "image": { "src": "https://cdn-icons-png.flaticon.com/512/833/833472.png", "width": 100, "height": 100 } },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 10, "random": true },
                "move": { "enable": true, "speed": 2, "direction": "bottom", "out_mode": "out" }
            }
        });
        function filterCat(category) {
            const items = document.querySelectorAll('.gallery-item');
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            items.forEach(item => {
                item.style.display = (category === 'all' || item.classList.contains(category)) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
