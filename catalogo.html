<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Detalles con Amor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">

<style>
    body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
    .card-wide { max-width: 900px !important; width: 95% !important; margin: 40px auto; position: relative; }
    
    /* --- Estilos de Imagen --- */
    .masonry-img { 
        cursor: zoom-in; 
        transition: transform 0.3s ease, filter 0.3s ease;
    }
    .masonry-img:hover { 
        transform: scale(1.03); 
        filter: brightness(1.1); 
    }

    /* --- Títulos y Nav --- */
    .section-title { 
        background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px);
        padding: 12px 25px; border-radius: 20px; display: inline-block;
        margin: 40px 0 25px 0; color: white; font-weight: 600;
        text-transform: uppercase; letter-spacing: 2px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .nav-sticky {
        position: sticky; top: 15px; z-index: 100;
        background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
        border-radius: 50px; padding: 8px; border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        max-width: fit-content; margin: 0 auto 40px auto;
    }

    .nav-btn {
        color: white; font-size: 0.75rem; font-weight: 600; padding: 8px 20px;
        border-radius: 50px; transition: 0.4s; display: flex; align-items: center; gap: 8px;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }

    /* --- Lightbox --- */
    .lightbox {
        display: none; position: fixed; z-index: 9999; top: 0; left: 0;
        width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px); align-items: center; justify-content: center;
        cursor: zoom-out; animation: fadeIn 0.3s ease;
    }
    .lightbox img {
        max-width: 90%; max-height: 85%; border-radius: 15px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5); transform: scale(0.9); transition: transform 0.3s ease;
    }
    .lightbox.active img { transform: scale(1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- Botón Flotante (FAB) --- */
    .fab-back {
        position: fixed; bottom: 30px; left: 20px;
        width: 55px; height: 55px;
        background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        color: white; font-size: 1.4rem; z-index: 9999;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: 0.4s;
    }
    .fab-back:hover { background: white; color: #E21C7F; transform: scale(1.1); }
</style>
</head>
<body>

    <a href="index.html" class="fab-back"><i class="fas fa-chevron-left"></i></a>

    <div id="particles-js"></div>

    <div class="card card-wide">
        <h2 class="text-white text-3xl font-bold text-center mb-2">Nuestro Catálogo 💐</h2>
        <p class="text-white/70 text-center text-sm mb-8">Toca una imagen para ampliar</p>

        <nav class="nav-sticky flex justify-center items-center gap-1">
            <a href="#flores" class="nav-btn"><i class="fas fa-seedling"></i> Flores</a>
            <a href="#cajas" class="nav-btn"><i class="fas fa-box-open"></i> Cajas</a>
            <a href="#globos" class="nav-btn"><i class="fas fa-cloud"></i> Globos</a>
        </nav>

        <div id="flores">
            <div class="section-title">Arreglos Florales</div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="grid gap-4">
                    <img class="masonry-img h-auto max-w-full rounded-lg" src="img/img1.jpeg" onclick="openLightbox(this.src)">
                    <img class="masonry-img h-auto max-w-full rounded-lg" src="img/img2.jpeg" onclick="openLightbox(this.src)">
                </div>
                <div class="grid gap-4">
                    <img class="masonry-img h-auto max-w-full rounded-lg" src="img/img4.jpeg" onclick="openLightbox(this.src)">
                    <img class="masonry-img h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1561181286-d3fee7d55364" onclick="openLightbox(this.src)">
                </div>
                <div class="grid gap-4">
                    <img class="masonry-img h-auto max-w-full rounded-lg" src="img/img3.jpeg" onclick="openLightbox(this.src)">
                </div>
            </div>
        </div>

        <div id="cajas" class="mt-10">
            <div class="section-title">Cajas Personalizadas</div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <img class="masonry-img h-auto max-w-full rounded-lg" src="img/img2.jpeg" onclick="openLightbox(this.src)">
                <img class="masonry-img h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48" onclick="openLightbox(this.src)">
            </div>
        </div>

         <div id="globos" class="mt-10">
            <div class="section-title">Cajas Personalizadas</div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <img class="masonry-img h-auto max-w-full rounded-lg" src="img/img2.jpeg" onclick="openLightbox(this.src)">
                <img class="masonry-img h-auto max-w-full rounded-lg" src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48" onclick="openLightbox(this.src)">
            </div>
        </div>

        <hr class="border-white/20 my-12">
        <p class="text-white/50 text-center text-xs pb-6">© 2026 Detalles con Amor</p>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Imagen Grande">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.style.display = 'flex';
            setTimeout(() => lightbox.classList.add('active'), 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            setTimeout(() => lightbox.style.display = 'none', 300);
        }

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 15 },
                "shape": { "type": "image", "image": { "src": "https://cdn-icons-png.flaticon.com/512/833/833472.png", "width": 100, "height": 100 } },
                "opacity": { "value": 0.3 },
                "size": { "value": 10 },
                "move": { "enable": true, "speed": 1.5, "direction": "bottom", "out_mode": "out" }
            }
        });
    </script>
</body>
</html>
